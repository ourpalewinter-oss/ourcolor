<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Color Archive</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css');

:root{--ink:#171717;--muted:#a5a5a5;--line:#e8e8e8;--bar:#e7e7e7;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-weight:500}
button,input,textarea{font:inherit}
button{cursor:pointer}

.stage{min-height:100svh;padding:clamp(30px,5vh,70px) clamp(22px,4vw,64px);display:grid;place-items:center;background:#fff}
.window{width:min(1180px,92vw);min-height:min(760px,86svh);border:1px solid #d8d8d8;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 22px 60px rgba(0,0,0,.055)}
.toolbar{height:62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;background:var(--bar);border-bottom:1px solid #dadada}
.toolbar-left,.toolbar-right{display:flex;align-items:center}
.toolbar-right{justify-content:flex-end}
.traffic{display:flex;gap:10px}.traffic span{width:14px;height:14px;border-radius:50%;background:#8b8b8b}
.title{margin-left:22px;font-size:15px;font-weight:700;white-space:nowrap}
.toolbar-center{display:flex;align-items:center;justify-content:center}
.icon-btn{width:34px;height:34px;border:0;background:transparent;color:#666;display:grid;place-items:center;border-radius:50%}
.icon-btn:hover{background:rgba(255,255,255,.42)}
.icon-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.content{padding:72px 76px 48px}
.intro{max-width:620px;margin:0 auto 24px;color:#a8a8a8;font-size:14px;line-height:1.75;text-align:center}
.pair-grid{max-width:650px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:86px}
.card{min-width:0;text-align:center}
.hex-input{width:100%;border:0;outline:0;background:transparent;text-align:center;text-transform:uppercase;color:#a0a0a0;font-size:16px;font-weight:700;margin-bottom:8px}
.color-square{position:relative;width:100%;aspect-ratio:1/1;border:1px solid #efefef;background:#000;overflow:hidden;cursor:pointer}
.color-square::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.16);pointer-events:none}
.color-square:hover{outline:2px solid #efefef;outline-offset:3px}
.image-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.image-preview.show{display:block}
.name-input,.memo-input,.result-memo{width:100%;border:0;border-bottom:1px solid transparent;outline:0;background:transparent;text-align:center;color:#a3a3a3}
.name-input{margin-top:10px;font-size:15px;font-weight:650}
.memo-input{margin-top:4px;font-size:12px}
.name-input:focus,.memo-input:focus,.result-memo:focus{border-bottom-color:#d9d9d9}
.source-label{min-height:16px;margin-top:5px;color:#b9b9b9;font-size:10px;text-align:center}
.mix-control{max-width:650px;margin:24px auto 0;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;color:#aaa;font-size:11px}
.mix-control input{width:100%;accent-color:#777}
.result-wrap{max-width:650px;margin:64px auto 0}
.result-box{position:relative;width:100%;aspect-ratio:2.7/1;border:1px solid #eee;background:#000;overflow:hidden}
.result-box canvas{width:100%;height:100%;display:block;contain:strict}
.result-overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#fff;text-align:center;font-size:13px;font-weight:650;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.28)}
.result-meta{margin-top:8px;display:flex;justify-content:flex-end}
.result-values{text-align:right}
.result-hex{color:#a4a4a4;font-size:16px;font-weight:700}
.result-memo{width:250px;max-width:60vw;margin-top:4px;text-align:right;color:#777;font-size:12px}
.footer-note{margin-top:18px;color:#b3b3b3;text-align:center;font-size:10px;min-height:14px}

.overlay{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:24px;background:rgba(255,255,255,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.overlay.open{display:grid}
.dialog{width:min(380px,calc(100vw - 40px));border:1px solid #d2d2d2;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.12)}
.dialog-bar{height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 13px;background:#e9e9e9;border-bottom:1px solid #d7d7d7}
.dialog-dots{display:flex;gap:7px}.dialog-dots span{width:10px;height:10px;border-radius:50%;background:#929292}
.dialog-title{font-size:12px;color:#666}
.dialog-x{justify-self:end;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#666;font-size:20px;line-height:1}
.dialog-x:hover{background:rgba(255,255,255,.55)}
.dialog-body{padding:24px;color:#777;font-size:13px;line-height:1.8}
.dialog-body p{margin:0 0 16px}.dialog-body p:last-of-type{margin-bottom:0}
.contact{margin-top:20px;color:#555;font-weight:700}
.close-btn{width:100%;height:42px;margin-top:22px;border:1px solid #d6d6d6;border-radius:10px;background:#f6f6f6;color:#555}
.choice-body{padding:14px}
.choice-btn{width:100%;height:46px;border:0;border-radius:10px;background:#f7f7f7;color:#555;margin-bottom:8px}
.choice-btn:hover{background:#f1f1f1}.choice-btn:last-child{margin-bottom:0}

.hidden-input{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:24px;z-index:3000;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:999px;background:#222;color:#fff;font-size:12px;transition:.2s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
 .stage{padding:22px 14px;place-items:start center}.window{width:min(680px,100%);min-height:0}.toolbar{height:54px;padding:0 16px}.traffic{gap:7px}.traffic span{width:11px;height:11px}.title{margin-left:12px;font-size:13px}.icon-btn{width:30px;height:30px}.icon-btn svg{width:20px;height:20px}
 .content{padding:48px 28px 36px}.intro{font-size:12px}.pair-grid{gap:28px;max-width:520px}.result-wrap{max-width:520px;margin-top:48px}.mix-control{max-width:520px}.result-box{aspect-ratio:2.1/1}
}
@media(max-width:480px){
 .content{padding:36px 18px 28px}.intro{display:none}.pair-grid{gap:14px}.hex-input{font-size:12px}.name-input{font-size:12px}.memo-input{font-size:10px}.source-label{font-size:8px}.result-wrap{margin-top:38px}.result-box{aspect-ratio:1.8/1}.result-hex{font-size:13px}.result-memo{font-size:10px;width:100%;max-width:100%}
}
</style>

<body>
<main class="stage">
  <section class="window" aria-label="Color Archive">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="title">Color Archive</div>
      </div>
      <div class="toolbar-right">
        <button class="icon-btn" id="shareBtn" type="button" aria-label="공유">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="m8 7 4-4 4 4"></path><path d="M5 11v8h14v-8"></path></svg>
        </button>
        <button class="icon-btn" id="infoBtn" type="button" aria-label="사이트 정보">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 10.5v6"></path><path d="M12 7.5h.01"></path></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <p class="intro">.</p>

      <section class="pair-grid">
        <article class="card" data-index="0">
          <input class="hex-input" id="hex0" value="#000000" maxlength="7" aria-label="첫 번째 HEX">
          <button class="color-square" id="square0" type="button" aria-label="첫 번째 색상 또는 이미지 선택">
            <img class="image-preview" id="preview0" alt="첫 번째 이미지 미리보기">
          </button>
          <input class="name-input" id="name0" placeholder="name" aria-label="첫 번째 이름">
          <input class="memo-input" id="memo0" placeholder="memo" aria-label="첫 번째 메모">
          <div class="source-label" id="label0"></div>
        </article>

        <article class="card" data-index="1">
          <input class="hex-input" id="hex1" value="#000000" maxlength="7" aria-label="두 번째 HEX">
          <button class="color-square" id="square1" type="button" aria-label="두 번째 색상 또는 이미지 선택">
            <img class="image-preview" id="preview1" alt="두 번째 이미지 미리보기">
          </button>
          <input class="name-input" id="name1" placeholder="name" aria-label="두 번째 이름">
          <input class="memo-input" id="memo1" placeholder="memo" aria-label="두 번째 메모">
          <div class="source-label" id="label1"></div>
        </article>
      </section>

      <div class="mix-control">
        <span></span>
        <input id="mixRange" type="range" min="0" max="100" value="50" aria-label="두 색상 혼합 비율">
        <span></span>
      </div>

      <section class="result-wrap">
        <div class="result-box" id="resultBox">
          <canvas id="resultCanvas" width="1300" height="480"></canvas>
          <div class="result-overlay" id="resultOverlay" aria-hidden="true"></div>
        </div>
        <div class="result-meta">
          <div class="result-values">
            <div class="result-hex" id="resultHex">#000000</div>
            <input class="result-memo" id="resultMemo" placeholder="memo" aria-label="결과 메모">
          </div>
        </div>
        <div class="footer-note" id="status"></div>
      </section>
    </div>
  </section>
</main>

<input class="hidden-input" id="colorPicker" type="color" value="#000000">
<input class="hidden-input" id="imagePicker" type="file" accept="image/*">

<div class="overlay" id="choiceOverlay" aria-hidden="true">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
    <div class="dialog-bar">
      <div class="dialog-dots"><span></span><span></span><span></span></div>
      <div class="dialog-title" id="choiceTitle">Select</div>
      <button class="dialog-x" id="choiceX" type="button" aria-label="닫기">×</button>
    </div>
    <div class="choice-body">
      <button class="choice-btn" id="pickColorBtn" type="button">Pick a Color</button>
      <button class="choice-btn" id="pickImageBtn" type="button">Choose an Image</button>
      <button class="choice-btn" id="choiceCancel" type="button">Cancel</button>
    </div>
  </section>
</div>

<div class="overlay" id="infoOverlay" aria-hidden="true">
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="dialog-bar">
      <div class="dialog-dots"><span></span><span></span><span></span></div>
      <div class="dialog-title" id="infoTitle">About</div>
      <button class="dialog-x" id="infoX" type="button" aria-label="닫기">×</button>
    </div>
    <div class="dialog-body">
      <p>우리가 품고 있는, 혹은 품었던 무수한 것들은 어떤 색을 띄고 있을까? 에서 시작되어 만들어진 사이트 입니다.</p>
      <p>드림 페어용으로 제작이 되었으나 여러분들이 좋아하는 일상의 한 부분이 어떤 색을 품고 있는지 확인해보세요 ♥</p>
      <p>⊕ 색이 표기되는 칸을 누르면 컬러 또는 이미지를 선택할 수 있습니다. 이미지는 미리보기로 유지되며, HEX 코드는 직접 입력하거나 컬러 피커로 별도로 설정할 수 있습니다.</p>
      <div class="contact">contact<br>uaaeuo@gmail.com</div>
      <button class="close-btn" id="closeInfoBtn" type="button">Close</button>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const state = {
    active: 0,
    colors: ['#000000', '#000000'],
    images: [null, null],
    imageUrls: [null, null]
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    squares: [$('square0'), $('square1')],
    hexes: [$('hex0'), $('hex1')],
    names: [$('name0'), $('name1')],
    memos: [$('memo0'), $('memo1')],
    previews: [$('preview0'), $('preview1')],
    labels: [$('label0'), $('label1')],
    choiceOverlay: $('choiceOverlay'),
    infoOverlay: $('infoOverlay'),
    colorPicker: $('colorPicker'),
    imagePicker: $('imagePicker'),
    mixRange: $('mixRange'),
    resultCanvas: $('resultCanvas'),
    resultHex: $('resultHex'),
    resultMemo: $('resultMemo'),
    resultOverlay: $('resultOverlay'),
    status: $('status'),
    toast: $('toast')
  };

  function normalizeHex(value) {
    let v = String(value || '').trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(v)) v = v.split('').map(c => c + c).join('');
    return /^[0-9a-fA-F]{6}$/.test(v) ? '#' + v.toUpperCase() : null;
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }

  function rgbToHex(r,g,b) {
    return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
  }

  function mixedColor() {
    const a = hexToRgb(state.colors[0]);
    const b = hexToRgb(state.colors[1]);
    const t = Number(els.mixRange.value) / 100;
    return rgbToHex(a.r*(1-t)+b.r*t, a.g*(1-t)+b.g*t, a.b*(1-t)+b.b*t);
  }

  function openOverlay(el) { el.classList.add('open'); el.setAttribute('aria-hidden','false'); }
  function closeOverlay(el) { el.classList.remove('open'); el.setAttribute('aria-hidden','true'); }

  function showToast(message) {
    els.toast.textContent = message;
    els.toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => els.toast.classList.remove('show'), 1800);
  }

  function setColor(index, hex, source='color') {
    const valid = normalizeHex(hex);
    if (!valid) return false;
    state.colors[index] = valid;
    els.hexes[index].value = valid;
    els.squares[index].style.background = valid;
    if (source === 'color' && !state.images[index]) {
      els.labels[index].textContent = 'color';
    }
    renderResult();
    return true;
  }

  async function handleImage(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const index = state.active;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (state.imageUrls[index]) URL.revokeObjectURL(state.imageUrls[index]);
      state.imageUrls[index] = url;
      state.images[index] = img;
      els.previews[index].src = url;
      els.previews[index].classList.add('show');
      els.labels[index].textContent = 'image';
      renderResult();
    };
    img.onerror = () => { URL.revokeObjectURL(url); showToast('이미지를 불러오지 못했어요.'); };
    img.src = url;
  }


  function renderResult() {
    const canvas = els.resultCanvas;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const mix = mixedColor();

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = mix;
    ctx.fillRect(0, 0, w, h);

    const n0 = els.names[0].value.trim();
    const n1 = els.names[1].value.trim();
    const m0 = els.memos[0].value.trim();
    const m1 = els.memos[1].value.trim();
    const text = [n0, n1].filter(Boolean).join(' × ');
    const sub = [m0, m1].filter(Boolean).join(' · ');

    if (text || sub) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,.96)';
      ctx.font = '600 34px Pretendard, sans-serif';
      if (text) ctx.fillText(text, w / 2, h / 2 - 4);
      if (sub) {
        ctx.font = '500 20px Pretendard, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,.78)';
        ctx.fillText(sub, w / 2, h / 2 + 34);
      }
      els.resultOverlay.style.display = 'none';
    } else {
      els.resultOverlay.style.display = 'grid';
    }

    els.resultHex.textContent = mix;
    els.resultBox.style.background = mix;
  }

  function openChoice(index) {
    state.active=index;
    openOverlay(els.choiceOverlay);
  }

  els.squares.forEach((el,i)=>el.addEventListener('click',()=>openChoice(i)));
  $('choiceX').addEventListener('click',()=>closeOverlay(els.choiceOverlay));
  $('choiceCancel').addEventListener('click',()=>closeOverlay(els.choiceOverlay));
  $('pickColorBtn').addEventListener('click',()=>{
    closeOverlay(els.choiceOverlay);
    els.colorPicker.value=state.colors[state.active];
    setTimeout(()=>els.colorPicker.click(),50);
  });
  $('pickImageBtn').addEventListener('click',()=>{
    closeOverlay(els.choiceOverlay);
    els.imagePicker.value='';
    setTimeout(()=>els.imagePicker.click(),50);
  });
  els.colorPicker.addEventListener('input',e=>setColor(state.active,e.target.value,'color'));
  els.imagePicker.addEventListener('change',e=>handleImage(e.target.files?.[0]));

  els.hexes.forEach((el,i)=>{
    el.addEventListener('change',()=>{ if(!setColor(i,el.value,'color')){el.value=state.colors[i];showToast('HEX 코드를 확인해주세요.');} });
    el.addEventListener('keydown',e=>{if(e.key==='Enter')el.blur()});
  });
  [...els.names,...els.memos,els.resultMemo].forEach(el=>el.addEventListener('input',renderResult));
  els.mixRange.addEventListener('input',renderResult);

  $('infoBtn').addEventListener('click',()=>openOverlay(els.infoOverlay));
  $('infoX').addEventListener('click',()=>closeOverlay(els.infoOverlay));
  $('closeInfoBtn').addEventListener('click',()=>closeOverlay(els.infoOverlay));
  [els.infoOverlay,els.choiceOverlay].forEach(overlay=>overlay.addEventListener('click',e=>{if(e.target===overlay)closeOverlay(overlay)}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeOverlay(els.infoOverlay);closeOverlay(els.choiceOverlay)}});

  $('shareBtn').addEventListener('click',async()=>{
    try{
      const blob=await new Promise(resolve=>els.resultCanvas.toBlob(resolve,'image/png'));
      const file=new File([blob],'color-archive.png',{type:'image/png'});
      if(navigator.share && navigator.canShare?.({files:[file]})){
        await navigator.share({title:'Color Archive',text:els.resultHex.textContent,files:[file]});
      }else if(navigator.share){
        await navigator.share({title:'Color Archive',text:`${els.resultHex.textContent} · ${location.href}`});
      }else{
        await navigator.clipboard.writeText(`${els.resultHex.textContent} · ${location.href}`);
        showToast('공유 문구를 복사했어요.');
      }
    }catch(err){if(err?.name!=='AbortError')showToast('공유하지 못했어요.');}
  });

  setColor(0,'#000000','color');
  setColor(1,'#000000','color');
  renderResult();
})();
</script>

</body>
</html>
